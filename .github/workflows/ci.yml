name: Test harness

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check As-Built OpenAPI
        run: python scripts/export_openapi.py --check

      - name: Tests and coverage
        run: |
          set -o pipefail
          python scripts/run_harness.py | tee test-output.log

      - name: Validate standardized container harness
        run: docker compose --profile test run --rm --build tests

      - name: Publish execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            test-output.log
            artifacts/
          if-no-files-found: warn
