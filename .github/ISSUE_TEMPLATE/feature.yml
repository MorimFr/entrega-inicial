name: Funcionalidade
description: Unidade independente de valor da sprint
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Qual problema esta tarefa resolve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: "- [ ] Dado..., quando..., então..."
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Requisitos da especificação
      placeholder: "RF-01, RN-02"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Testes esperados
    validations:
      required: true

